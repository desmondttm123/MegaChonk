name: Deploy Mega Chonk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check game syntax
        run: |
          node --input-type=module --check < game.js
          node --input-type=module --check < course-generator.js
          node --input-type=module --check < camera-controls.js
          node --input-type=module --check < touch-controls.js
          node --input-type=module --check < jump-rules.js
          node --input-type=module --check < adventure-rules.js
          node --input-type=module --check < adventure-world.js
          node --input-type=module --check < condition-rules.js
          node --input-type=module --check < cat-condition-visual.js
          node --input-type=module --check < body-trials.js
      - name: Check adventure rules
        run: node tools/adventure-rules-test.js
      - name: Check condition balance
        run: node tools/condition-rules-test.js
      - name: Build runtime-only site
        run: python3 tools/build_pages.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
